name: daily-crawl

# Runs the crawl in the cloud so you don't need your PC on.
# - Fetches the latest Power 6/55 and 6/45 draws
# - Commits new draws back into data/*.jsonl
# - Runs the ML predict->score loop (scorecard persists in predictions/)
# - Builds the HTML dashboard (with ML scorecard), uploads it as an artifact,
#   and publishes it to GitHub Pages (repo is public)

on:
  schedule:
    # 12:00 UTC = 19:00 Vietnam time (UTC+7) — soon after the 18:00 draw.
    # GitHub may delay scheduled runs by several minutes.
    - cron: "0 12 * * *"
  workflow_dispatch: {}      # lets you run it manually from the Actions tab
  push:                      # when you push new draws locally, rebuild + redeploy
    paths:
      - "data/**"
      - "predictions/**"
    # (the bot's own data commits use GITHUB_TOKEN, which does NOT retrigger
    #  workflows, so this can't loop.)

permissions:
  contents: write            # commit updated data back to the repo
  pages: write               # deploy to GitHub Pages
  id-token: write            # required by the Pages deploy action

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies (with ML extras)
        run: uv sync --extra ml

      # The cloud runner can't reach vietlott.vn (its IPs are blocked -> 403),
      # so it never has new draws to commit. Data + predictions are the PC's
      # job; the cloud only rebuilds the dashboard from what the PC pushed and
      # deploys it. It deliberately does NOT commit anything back, which would
      # otherwise collide with the PC's next push.
      - name: Build dashboard from committed data
        run: uv run python run.py daily

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp reports/dashboard.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload dashboard + report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucky-dashboard
          path: |
            reports/dashboard.html
            reports/latest.md
          retention-days: 30
          if-no-files-found: warn

  deploy-pages:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
