name: daily-crawl

# Runs the crawl in the cloud so you don't need your PC on.
# - Fetches the latest Power 6/55 and 6/45 draws
# - Commits new draws back into data/*.jsonl
# - Runs the ML predict->score loop (scorecard persists in predictions/)
# - Builds the HTML dashboard (with ML scorecard), uploads it as an artifact,
#   and publishes it to GitHub Pages (repo is public)

# NOTE: there is deliberately no `schedule:` cron. vietlott.vn blocks GitHub's
# runner IPs (403), so a nightly cloud crawl could only ever fail. The PC's
# daily.bat crawls (Vietnam IP) and pushes; this workflow just rebuilds the
# dashboard from what was pushed and deploys it to Pages.
on:
  workflow_dispatch:         # manual run from the Actions tab
    inputs:
      try_crawl:
        description: "Attempt the crawl (only useful if vietlott.vn ever unblocks GitHub IPs)"
        type: boolean
        default: false
  push:                      # when you push new draws locally, rebuild + redeploy
    paths:
      - "data/**"
      - "predictions/**"
    # (the bot's own data commits use GITHUB_TOKEN, which does NOT retrigger
    #  workflows, so this can't loop.)

permissions:
  contents: write            # commit updated data back to the repo
  pages: write               # deploy to GitHub Pages
  id-token: write            # required by the Pages deploy action

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies (with ML extras)
        run: uv sync --extra ml

      # Automatic runs skip the crawl entirely (no 403 noise). To retest whether
      # the block has lifted, run this workflow manually with try_crawl = true.
      # Either way the cloud does NOT commit anything back — that would collide
      # with the PC's next push. It only rebuilds and deploys.
      - name: Rebuild dashboard from committed data
        run: uv run python run.py daily ${{ inputs.try_crawl && ' ' || '--no-crawl' }}

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp reports/dashboard.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload dashboard + report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucky-dashboard
          path: |
            reports/dashboard.html
            reports/latest.md
          retention-days: 30
          if-no-files-found: warn

  deploy-pages:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
